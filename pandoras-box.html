<body>

    <main>
        <section class="page pandora-page">
            <a class="pandora-box" href="https://drive.google.com/drive/folders/1Xvd6ktC0QCZUu9Z__DVcdR-5qO-q2RyA" target="_blank" rel="noopener noreferrer" aria-label="Open Pandora's box">
                <img class="pandora-eyes" src="img/1.05.24%20eyes.gif" alt="">
            </a>
        </section>
    </main>

    <script>
        const eyes = document.querySelector('.pandora-eyes');
        const src = eyes.getAttribute('src');
        const showMs = 1600;
        const hideMs = 4000;

        function showEyes() {
            eyes.style.visibility = 'visible';
            eyes.src = '';
            eyes.src = src;
            window.setTimeout(hideEyes, showMs);
        }

        function hideEyes() {
            eyes.style.visibility = 'hidden';
            window.setTimeout(showEyes, hideMs);
        }

        showEyes();
    </script>

</body>
